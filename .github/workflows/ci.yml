name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and Plasma tooling
        run: pacman -Syu --noconfirm qt6-declarative plasma-workspace kirigami python make
      - run: make test
      - run: make lint
      - name: Validate metadata
        run: python -c 'import json; json.load(open("metadata.json"))'
      - name: Build plasmoid
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: climate-deck-plasmoid
          path: dist/climate-deck.plasmoid
